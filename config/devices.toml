# Device configuration. Ports are resolved by USB serial number (as reported by pyserial),
# so COM renumbering does not matter. If `usb_serial` is set but not found, connecting fails
# (it never falls back to `port`, which could be a different device); `port` = last known COM.

[devices.hitmv]
type = "hitmv"
label = "VUV feedthroughs"        # tab title in the GUI
units_per_mm = 500000             # display only: 30000000 units = 60 mm real
usb_serial = "DU0DFFMCA"   # RS-232 -> USB adapter
port = "COM4"
baudrate = 38400
rtscts = true
mode = "HIT"
# Insert = origin return (H:). Before each H: our driver sends B: with the controller's own
# homing S/R/M and F = homing_max_speed (user requirement). 0 = do not send B:.
homing_max_speed = 1000000      # units/s = 2 mm/s real
speed = [100000, 1000000, 200]  # D: start, max (units/s), accel (ms) — sent before retract, as SGSample
# Interlock (user, 2026-11-17): the two feedthroughs must NEVER be inserted at the same time.
# Insert (or any move away from retracted) is refused unless every other axis is fully retracted.
exclusive_axes = true
insert_timeout_s = 120
move_timeout_s = 90

# Both feedthroughs are in the VUV diagnostic chamber (see ref/NIMA_vuv_light_source.pdf, Fig. 4).
# Normal operation: BOTH retracted. Values are raw controller units:
# 30000000 units = 60 mm real travel (1 unit = 2 nm; the manual's nominal 0.01 um is NOT valid here).
# INSERTED is reached by origin return (H:, "ORG" in SGSample) = 0, not by an absolute move.
# Confirmed by capture 2026-11-16 (docs/protocols.md).

[devices.hitmv.axes.0]
name = "vuv_photodiode"    # SXUV300C VUV photodiode (+122 nm filter), pulse-energy measurement
label = "VUV photodiode"
positions = { RETRACTED = 30000000, INSERTED = 0 }
default = "RETRACTED"

[devices.hitmv.axes.1]
name = "vuv_mirror"        # 45 deg VUV mirror that sends the beam to the VUV beam profiler
label = "VUV mirror (to profiler)"
positions = { RETRACTED = 30000000, INSERTED = 0 }
default = "RETRACTED"

[devices.ell14]
type = "ell14"
label = "Rotation mount"   # tab title in the GUI
usb_serial = "DP06TVEFA"
port = "COM3"
baudrate = 9600
address = "0"
terminator = "\u0007"   # what ELLO sends after every command; "" (none, as in the manual) also works

[devices.ell14.positions]   # named angles in degrees — to be defined with the user

[devices.flipmounts]
type = "mff"               # Thorlabs MFF101 motorized flip mounts (APT protocol, FTDI D2XX)
label = "Flip mounts"      # tab title; one card per unit (user, 2026-11-17)
move_timeout_s = 3         # a flip takes ~0.4 s (transit time 500 ms)
# Each unit: USB serial number (no COM port; Kinesis must be closed). insert_position = which of
# the flipper's two positions (1 or 2) is "insert"; the other one is "retract".

[devices.flipmounts.units.flip1]
label = "355 nm blocker"   # user 2026-11-18
usb_serial = "37011815"
insert_position = 2        # user 2026-11-17: position 2 = insert, position 1 = retract

[devices.flipmounts.units.flip2]
label = "820 nm blocker"   # user 2026-11-18; 6 m USB cable (link tested stable)
usb_serial = "37006391"
insert_position = 2        # user 2026-11-18: same as unit 1
# its DIG IO 2 was a factory "input-goto" (flips bounced back); set to output in Kinesis and
# persisted to the device on 2026-11-18 — see docs/protocols.md § MFF101 Unit 2

[devices.dg645]
type = "dg645"             # SRS DG645 delay generator (docs/protocols.md § DG645)
label = "Delay generator"  # tab title
usb_serial = "CGBHB2A4517" # Prolific PL2303GT RS-232 -> USB adapter (read 2026-11-20)
port = "COM7"
baudrate = 9600            # DG645 default; RTS/CTS fixed by the DG645
rtscts = true
# Ours is output CD (user 2026-11-20): C = rising edge = trigger to the laser side, D linked to
# C (D = C + 500 ns, fixed width). The program writes ONLY channel C (relative to T0); all other
# channels belong to other groups and are only read (changes made by hand are logged).
channel = "C"
width_channel = "D"
nominal_s = 0.036580467    # C on 2026-11-20 = nominal (user)
min_offset_us = -1.5       # hard limits around nominal (user 2026-11-20)
max_offset_us = 3.0
step_us = 0.1              # step buttons (user 2026-11-20)
# Any communication locks the DG645 front panel (REM on) until Unlock (LCAL) or its key "3".
# So the program reads rarely (user 2026-11-20); "Read now" in the tab reads at once.
read_interval_s = 300

# ---------------------------------------------------------------------------------------------
# DAQ devices (F8, merged from the old H2LaserDAQ and IDS-Camera programs).
# PicoScope tabs: the acquisition setup is chosen on the tab's start page from the config files
# in config_dir whose `mode` matches (user 2026-11-18); default_config is preselected.
# Config file keys are exactly the old DIGITIZER_CONFIGS keys (see the old README):
# model "3405D" (ps3000a) or "2204A" (ps2000); voltage_range strings as the SDK enum names
# ("200MV", "2V"); timebase 3405D: 0=1 ns, 1=2 ns, 2=4 ns, n>2: (n-2)*8 ns; 2204A: 10*2^n ns;
# pre_trigger in %; trigger_level in mV; auto_trigger in ms (0 = wait forever); 3405D also
# offset (V per channel) and trigger_delay (samples); snapshot also snapshot_channel and
# refresh_trigger_cnt. data_path is relative to the program folder (root/, csv/, snapshots/).

[devices.scope_monitor]
type = "picoscope"
label = "Scope monitor"
mode = "continuous"
config_dir = "config/picoscope"
default_config = "monitor_2026A.toml"   # user 2026-11-18

[devices.vuv_pd]
type = "picoscope"
label = "VUV PD snapshot"
mode = "snapshot"
config_dir = "config/picoscope"
default_config = "H2PD_261103.toml"     # user 2026-11-18

[devices.camera]
type = "ids_camera"
label = "Camera"
model = "IDS U3-327xCP-C"
usb_serial = "4110039161"  # read 2026-11-18 (USB 2.0 link: max ~19 fps full frame)
config_dir = "config/camera"      # camera settings files (the old configs/ folder)
default_config = "default.toml"   # loaded when the camera is opened
output_dir = "data/camera"        # shown on the start page; the folder used is the camera
                                  # config's output_dir (all set to data/camera)
