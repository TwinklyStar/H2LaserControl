# PicoScope config, converted from the old H2LaserDAQ config/config_LaserRoomPD.py (2026-11-18).
# Keys as in the old DIGITIZER_CONFIGS; see config/devices.toml for their meaning.
# data_path: relative to the program folder (old 'data' -> 'data/picoscope').
title = "Laser Room VUV Photodiode"
mode = "snapshot"  # continuous | snapshot

[digitizers.LaserRoomPD]
model = "2204A"
serial = "12017/0137"
snapshot_channel = "A"
refresh_trigger_cnt = 100
channels = ["A", "B"]
channel_name = ["Sig", "Trig"]
voltage_range = { A = "2V", B = "2V" }
timebase = 1
sample_number = 1000
trigger_channel = "A"
trigger_level = 200
pre_trigger = 10
trigger_edge = "RISING"
auto_trigger = 1000
output_name = "LaserRoomPD_test01"
data_path = "data/picoscope"
