[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "h2lasercontrol"
version = "0.0.1"
description = "Unified control of H2 laser room devices (Sigma Koki HIT-MV, Thorlabs ELL14, MFF101)"
requires-python = ">=3.12"
dependencies = [
    "pyserial>=3.5",
    "PySide6>=6.6",
    # DAQ merge (F8): PicoScope + IDS camera
    "numpy",
    "pyqtgraph",
    "uproot",          # ROOT output (PicoScope rawWave tree, camera BMP -> ROOT)
    "awkward",
    "picosdk",         # PicoScope ctypes wrappers; needs PicoSDK DLLs (ps2000, ps3000a)
    "ids-peak",        # IDS camera; needs the IDS peak runtime installed
    "ids-peak-ipl",
    "ids-peak-common",
    "opencv-python",   # camera BMP writing
    "imageio",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt", "ruff"]

[project.gui-scripts]
h2lasercontrol = "h2lasercontrol.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: full-resolution throughput test (camera; deselect with -m \"not slow\")"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# camera package copied unchanged from the old IDS-Camera project (F8b, "exact copy"); it was
# written for E/F/W/I only, so the extra rule families of this project are not applied to it
"src/h2lasercontrol/laserdaq/**" = ["BLE001", "S110", "UP035", "RUF046", "SIM115", "RUF100"]
"tests/camera/**" = ["BLE001", "S110", "UP035", "RUF046", "SIM115", "RUF100", "B023", "SIM118",
                     "PLW1510", "RUF059", "RUF007"]
