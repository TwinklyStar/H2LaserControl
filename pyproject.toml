[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "h2lasercontrol"
version = "0.0.1"
description = "Unified control of H2 laser room devices (Sigma Koki HIT-MV, Thorlabs ELL14, MFF101)"
requires-python = ">=3.12"
dependencies = ["pyserial>=3.5", "PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt", "ruff"]

[project.gui-scripts]
h2lasercontrol = "h2lasercontrol.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
